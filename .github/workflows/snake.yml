name: Generate Snake

on:
  # 每天 UTC 0 点自动重建
  schedule:
    - cron: "0 0 * * *"
  # 每次推送到 main 也重建
  push:
    branches:
      - main
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake svg
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23007F9E&color_dots=%23EAF2F8,%23C3E3EE,%2379C3D9,%232E96B4,%230B607D
            dist/github-contribution-grid-snake-dark.svg?color_snake=%238B7CFF&color_dots=%23132337,%23173E52,%231C6173,%232B96A6,%2366E3FF

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
